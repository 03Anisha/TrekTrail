{% extends "base.html" %}
{% block title %}My Profile - TrekManager{% endblock %}

{% block content %}
<div class="page-header">
    <h2>My Profile</h2>
    <p>Update your personal information</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="form-section">
            <form method="POST" novalidate>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" value="{{ user.email }}" disabled>
                    <div class="text-muted-small mt-2">Email cannot be changed.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
                </div>
                <div class="mb-4">
                    <label class="form-label">Emergency Contact</label>
                    <input type="text" name="emergency_contact" class="form-control"
                           value="{{ user.emergency_contact or '' }}" placeholder="Emergency contact number">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-orange">Save Changes</button>
                    <a href="{{ url_for('user_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
